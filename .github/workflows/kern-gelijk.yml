name: Kern en sites lopen gelijk

# Het sluitstuk onder de gedeelde kern. Zonder deze controle faalt de opzet
# stilletjes: iemand past een gedeeld bestand aan binnen één site, het werkt
# daar, en maanden later lopen de sites weer uiteen. Precies zo ging het de
# vorige keer mis.
#
# Wat hier draait is hetzelfde als 'npm run controle' op je eigen machine,
# stap voor stap. Dat is met opzet: zodra CI iets anders doet dan jij, gaat
# "bij mij was het groen" een eigen leven leiden.

# Waarom push alleen op de hoofdbranch: met branches ["**"] startte elke duw
# naar een PR-tak deze controle twee keer, een keer via push en een keer via
# pull_request. Twee keer hetzelfde werk, twee keer een Chromium van 300 MB
# ophalen, en twee kansen dat er een blijft hangen. Dat gebeurde ook: op
# 19 augustus stond dezelfde commit tegelijk groen (via pull_request) en
# vastgelopen (via push).
on:
  push:
    branches: ["claude/home-battery-comparison-nl-qxolhe"]
    paths:
      - "kern/**"
      - "sites/**"
      - "scripts/**"
      - "package.json"
  pull_request:
    paths:
      - "kern/**"
      - "sites/**"
      - "scripts/**"
      - "package.json"
  workflow_dispatch: {}

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Kern vergelijken met de sites
        run: npm run kern:controleer

      # De proeven bij prijs.mjs en prijs-uitlezen.mjs stonden er al, maar
      # niemand draaide ze automatisch. Juist die rekenen met geld: een fout
      # daarin zie je op de site niet als een fout, maar als een prijs.
      - name: Proeven draaien
        run: npm test

      - name: Herkenning van modelnamen toetsen
        run: npm run modellen

      # Een stap die naar steps.X kijkt terwijl X in een ander blok staat wordt
      # door GitHub niet afgekeurd: de verwijzing wordt leeg, de voorwaarde
      # onwaar, en de stap slaat zichzelf elke run over zonder iets roods.
      - name: Verwijzingen binnen de workflows
        run: npm run workflows

      # Jaartallen in titels en koppen die achterlopen op de kalender. De
      # gegenereerde pagina's rollen vanzelf om bij de dagelijkse prijsrun; de
      # handgeschreven niet, en daar hoort bij het jaartal ook inhoud die
      # iemand moet nakijken.
      - name: Teksten die aan een datum hangen
        run: npm run datums

      # llms.txt is de index die assistenten lezen. De sitemap wordt
      # gegenereerd en klopt dus vanzelf; deze is handwerk en bleef achter toen
      # er zes pagina's bij kwamen, zonder dat iets dat liet zien.
      - name: llms.txt gelijk met het menu
        run: npm run llms

      # Schrijfstijl verloopt zoals llms.txt verliep: niemand besluit ooit om
      # vager te gaan schrijven, het zakt weg per alinea. De regels staan in
      # SCHRIJFWIJZE.md; dit bewaakt de vier die te meten zijn.
      - name: De tekst is nog scherp
        run: npm run slop

  # De keuring start een echte browser en is daarom een aparte baan: hij duurt
  # langer dan de rest samen, en als hij valt wil je kunnen zien of de andere
  # controles wél doorkwamen.
  keuren:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Playwright staat bewust niet in package.json: de rest van de repo
      # heeft nul afhankelijkheden en dat is het waard om te houden.
      # Met een grens erop, want deze stap kan blijven hangen. Op 19 augustus
      # stond hij 285 minuten op het ophalen van Chromium en zou hij pas na
      # zes uur zijn afgekapt door de standaardgrens van GitHub - al die tijd
      # met een pull request die op "checks nog niet klaar" bleef staan. Een
      # download van 300 MB die na tien minuten niet klaar is, komt niet meer
      # goed; dan is snel falen beter, want opnieuw draaien is een knop.
      - name: Browser klaarzetten
        timeout-minutes: 10
        run: npm i --no-save playwright && npx playwright install --with-deps chromium

      # Contrast, aanraakvlakken, tekstmaten en javascriptfouten over elke
      # pagina van de drie sites, op 1280 en 390 pixels breed.
      - name: Keuring
        run: npm run keuring

      # En het omgekeerde: regels die er wel staan maar overal verliezen. Het
      # opschrift boven de hero stond op 12px in de merkkleur en rendeerde als
      # 19px grijs; formeel klopte dat, dus de keuring zag het niet.
      - name: Regels die niets doen
        run: npm run dode-regels
