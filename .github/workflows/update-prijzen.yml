name: Dagelijkse prijsupdate

# Eén workflow voor de drie sites. Elke site heeft dezelfde npm-commando's met
# een eigen generator erachter, dus alleen de map verschilt.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Eén site draaien in plaats van alle drie"
        required: false
        type: choice
        options: ["alle", "batterijmaatje", "zonnestroommaatje", "warmtepompmaatje"]
        default: "alle"
      droog:
        # De ontwikkelomgeving komt niet bij winkelpagina's (de egress-proxy
        # laat alleen npm en pypi door), dus een wijziging aan het uitlezen van
        # prijzen is daar niet te beoordelen. Hiermee is dat hier wel te doen:
        # de runner bezoekt de winkels, het logboek laat zien welk bedrag elke
        # weg oplevert, en er wordt niets weggeschreven of geduwd.
        description: "Alleen kijken: prijzen ophalen zonder iets weg te schrijven"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prijzen:
    runs-on: ubuntu-latest
    strategy:
      # Niet parallel: de sites duwen naar dezelfde tak, en tegelijk pushen
      # levert een afgewezen push op in plaats van een tweede commit.
      max-parallel: 1
      fail-fast: false
      matrix:
        site: [batterijmaatje, zonnestroommaatje, warmtepompmaatje]
    steps:
      - name: Bepalen of deze site meedoet
        id: keuze
        run: |
          gekozen="${{ github.event.inputs.site }}"
          if [ -n "$gekozen" ] && [ "$gekozen" != "alle" ] && [ "$gekozen" != "${{ matrix.site }}" ]; then
            echo "doen=false" >> "$GITHUB_OUTPUT"
          else
            echo "doen=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Code ophalen
        if: steps.keuze.outputs.doen == 'true'
        uses: actions/checkout@v4

      - name: Node.js instellen
        if: steps.keuze.outputs.doen == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # De enige stap die de run wel laat falen. De andere controles melden,
      # want die gaan over gegevens waar een fabrikant iets aan moet doen. Deze
      # gaat over onze eigen logica: prijs.js en condities.js bepalen wat
      # vergelijkbaar is, en dat voedt de vergelijker, de keuzehulp, de
      # rekenmodule en de generator tegelijk. Een stille fout daar verandert
      # elke prijs op elke pagina.
      - name: Tests
        if: steps.keuze.outputs.doen == 'true'
        working-directory: sites/${{ matrix.site }}
        run: npm test

      - name: Prijzen bijwerken
        id: prijzen
        if: steps.keuze.outputs.doen == 'true'
        working-directory: sites/${{ matrix.site }}
        env:
          # Zonder deze secrets worden bol-prijzen overgeslagen en blijft de
          # oude prijs staan; het script faalt daar niet op.
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: npm run prijzen ${{ github.event.inputs.droog == 'true' && '-- --droog' || '' }}

      # Prijzen werken zichzelf bij, maar een nieuw model verschijnt nergens
      # vanzelf. Deze stap zoekt ernaar en meldt alleen: toevoegen blijft
      # mensenwerk, want een verkeerd toegevoegd model krijgt een pagina en een
      # plek in de vergelijking zonder dat iemand de specificaties heeft gezien.
      # Faalt nooit de run: dit is een signaal, geen bewaking.
      - name: Nieuwe modellen zoeken
        if: steps.keuze.outputs.doen == 'true'
        continue-on-error: true
        working-directory: sites/${{ matrix.site }}
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: npm run modellen

      # Van zestien batterijen ligt niet vast of het getal in vermogen_kw het
      # continue vermogen is, een piek, of de 800 W die op een gedeelde groep is
      # toegestaan. Die staan door elkaar in een kolom waarop de site
      # vergelijkt. De datasheets staan op de sites van de fabrikanten, en daar
      # kan de ontwikkelomgeving niet bij (de egress-proxy laat alleen npm en
      # pypi door) maar de runner wel.
      #
      # Rapporteert alleen; overnemen is mensenwerk. Een regex die "5 kW" naast
      # het woord "continu" ziet is een aanwijzing, geen specificatie.
      - name: Vermogens op fabrikantpagina's zoeken
        if: steps.keuze.outputs.doen == 'true' && matrix.site == 'batterijmaatje'
        continue-on-error: true
        working-directory: sites/batterijmaatje
        run: npm run vermogens

      - name: Pagina's en sitemap herbouwen
        if: steps.keuze.outputs.doen == 'true' && github.event.inputs.droog != 'true'
        working-directory: sites/${{ matrix.site }}
        run: npm run genereer

      # Interne links kosten geen seconde en geen internet, maar vangen af dat
      # de generator een pagina wegschrijft die naar een bestand verwijst dat
      # niet bestaat. De externe links gaan mee, minus de winkels: die heeft het
      # prijsscript hierboven zojuist al bezocht en het meldt zelf welke
      # verdwenen zijn.
      - name: Links controleren
        if: steps.keuze.outputs.doen == 'true'
        working-directory: sites/${{ matrix.site }}
        run: node scripts/controleer-links.mjs --zonder-winkels

      - name: Wijzigingen committen en pushen
        if: steps.keuze.outputs.doen == 'true' && github.event.inputs.droog != 'true'
        run: |
          git config user.name "prijsupdate-bot"
          git config user.email "actions@github.com"
          git add "sites/${{ matrix.site }}"
          if git diff --cached --quiet; then
            echo "Geen prijswijzigingen voor ${{ matrix.site }}."
          else
            git commit -m "Dagelijkse prijsupdate ${{ matrix.site }} $(date -u +%F)"
            # Een eerdere site in dezelfde run kan net geduwd hebben.
            git pull --rebase --autostash
            git push
          fi

  # De matrix hierboven kan groen zijn terwijl een site toch stilstaat: als een
  # site uit de matrix valt, als de workflow op de hoofdtak achterloopt, of als
  # een push mislukt. Dat is precies wat er met warmtepompmaatje gebeurde -
  # twaalf dagen oude prijzen achter een dagelijks geslaagde workflow, met
  # "Bijgewerkt: 30 juli" op de site. Deze controle kijkt naar de uitkomst in
  # plaats van naar de stappen, en draait dus over alle drie de sites tegelijk.
  verse-data:
    runs-on: ubuntu-latest
    needs: prijzen
    if: always()
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
        with:
          # De matrix heeft zojuist geduwd; zonder dit staat hier de versie van
          # voor de update en meldt de controle een dag te veel.
          ref: ${{ github.ref_name }}

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Drie controles die geen enkele stap laten falen maar wel elke dag
      # melden. Ze bewaken alle drie hetzelfde soort fout: iets dat klopte toen
      # het geschreven werd en stilletjes onwaar wordt, zonder dat iemand er
      # iets voor hoeft te doen.

      # Titels, omschrijvingen, canonicals en de productmarkup. Die stonden op
      # twee van de drie sites ver buiten wat Google toont - 67 titels tot 103
      # tekens - en van de zestig offers had er geen enkele een
      # houdbaarheidsdatum. Met de hand rechtgezet, en zonder controle zakt dat
      # net zo geruisloos terug: een generator die een zin een half woord langer
      # maakt ziet niemand, want de pagina werkt gewoon.
      - name: Wat de zoekmachine ziet
        continue-on-error: true
        run: node scripts/zoekmachine.mjs

      # Teksten die aan de kalender hangen verlopen zonder dat iemand iets doet:
      # niemand verandert iets, de datum verschuift en de site heeft ongelijk.
      # In de rekenmodule stond het aanschafjaar hard op 2026, wat op 1 januari
      # een half jaar salderingsvoordeel zou toerekenen dat er niet meer is.
      - name: Teksten die aan een datum hangen
        continue-on-error: true
        run: node scripts/datumteksten.mjs

      # Vijf keer is op deze sites een getal vergeleken met een getal dat iets
      # anders betekende: btw, bruto capaciteit, apparaat tegenover compleet,
      # milde dag tegenover koude dag, stuksprijs tegenover systeemprijs. Elke
      # keer viel het pas op toen iemand het toevallig opmerkte. Deze controle
      # meldt het zodra een getal de gegevens in komt zonder dat vastligt wat
      # het is. Faalt de run niet: een controle die rood kan blijven staan omdat
      # een fabrikant iets niet publiceert, leest niemand meer.
      - name: Vergelijkbaarheid van de getallen
        continue-on-error: true
        run: node scripts/vergelijkbaar.mjs

      - name: Ouderdom van de gegevens per site
        run: |
          fout=0
          for site in sites/*/; do
            ( cd "$site" && node scripts/verse-data.mjs --streng ) || fout=1
          done
          exit $fout

      # Alles hierboven is al weggeschreven en gepusht: een signaal mag de
      # dagelijkse ronde niet tegenhouden. Maar groen blijven mag ook niet.
      # De samenvatting van de prijsstap stond er al; alleen keek niemand,
      # want er was niets dat om aandacht vroeg. Twaalf prijzen liepen daardoor
      # 33 dagen achter en een bedrag van 9.000 euro stond naast een winkel die
      # 4.945 vraagt - opgemerkt doordat iemand toevallig op een pagina klikte.
      - name: Prijzen die aandacht vragen
        if: steps.keuze.outputs.doen == 'true' && steps.prijzen.outputs.aandacht != '0'
        run: |
          echo "${{ matrix.site }}: ${{ steps.prijzen.outputs.aandacht_kort }}"
          echo "Zie de samenvatting van deze run voor de tabellen per soort."
          exit 1
