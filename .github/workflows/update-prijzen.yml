name: Dagelijkse prijsupdate

on:
  schedule:
    # Elke dag om 05:30 UTC (07:30 Nederlandse zomertijd)
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Nodig om na een prijswijziging de publicatie-workflow te mogen starten
  actions: write

jobs:
  update-prijzen:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prijzen bijwerken
        env:
          # Bol.com Marketing API (partner): repository secrets; zonder deze
          # secrets worden bol-prijzen overgeslagen en blijft de oude staan
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: node scripts/update-prices.mjs

      - name: Batterijpagina's en sitemap herbouwen
        run: node scripts/genereer-batterijpaginas.mjs

      # Interne links kosten geen seconde en geen internet, maar vangen af dat de
      # generator een pagina wegschrijft die naar een bestand verwijst dat niet
      # bestaat. De externe links gaan mee in dezelfde run, minus de winkels:
      # die heeft het prijsscript hierboven zojuist al bezocht, en het meldt zelf
      # welke verdwenen zijn. Twee keer dezelfde webshop ophalen levert niets op.
      - name: Links controleren
        run: node scripts/controleer-links.mjs --zonder-winkels

      - name: Wijzigingen committen en pushen
        id: commit
        run: |
          git config user.name "prijsupdate-bot"
          git config user.email "actions@github.com"
          git add data/batterijen.json sitemap.xml index.html batterij/ vergelijk/ beste-thuisbatterij-home-assistant.html beste-thuisbatterij-homey.html
          if git diff --cached --quiet; then
            echo "Geen prijswijzigingen vandaag."
            echo "gewijzigd=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Dagelijkse prijsupdate $(date -u +%F)"
            git push
            echo "gewijzigd=true" >> "$GITHUB_OUTPUT"
          fi

      # Publiceren gebeurt door Vercel: de Git-integratie luistert naar de push
      # hierboven en bouwt de site opnieuw. De beperking dat een push met het
      # standaard GITHUB_TOKEN geen andere workflows start, geldt alleen binnen
      # GitHub Actions en dus niet voor Vercel. Er is hier geen extra stap nodig.
