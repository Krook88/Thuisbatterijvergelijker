name: Wat staat er op een winkelpagina

# Met de hand te starten, voor als een prijs "te controleren" is en de vraag is
# waarom. De lijst meldt "€6200 → €1495 (-76%)" en dat kan twee dingen zijn: de
# winkel is gehalveerd, of het script leest de losse module op een pagina waar
# ook het pakket staat. Dat verschil bepaalt of er een prijs moet veranderen of
# een URL, en het is niet te zien zonder de pagina.
#
# Waarom hier en niet op je eigen machine: de ontwikkelomgeving komt niet bij
# winkels. De egress-proxy laat alleen npm en pypi door, dus curl en fetch
# krijgen daar een 403 van de proxy in plaats van een antwoord van de winkel.
# Een runner komt er wel bij. Dezelfde reden waarom de prijsupdate een
# droog-stand heeft.
#
# Met `zoek` doet hij er nog iets bij: elk stuk zichtbare tekst waar een van de
# opgegeven woorden in staat, met de zin eromheen. Dat is voor de andere vraag
# die deze omgeving niet kan beantwoorden - wat is de SCOP van deze pomp, hoeveel
# dB(A) maakt de buitenunit - want die getallen staan op de fabrikantpagina en
# niet in een prijsveld. Voorheen moest dat met de hand uit een datasheet komen.
#
# Met `links` toont hij de adressen op de pagina waar een stuk tekst in staat.
# Dat is voor de stap ervoor: `zoek` haalde de hele WPL ACS Classic-familie van
# de Stiebel-categoriepagina, maar dat zijn namen en geen adressen, en de
# specificaties staan een pagina verder. Adressen raden werkt hier niet - Stiebel
# stuurt bij een onbekend pad geen 404 maar een vangnetpagina, dus aan de
# statuscode zie je niet of je goed zat. Nu is het één run: categoriepagina
# lezen, adressen eruit, die lezen.
#
# Schrijft niets weg, commit niets en duwt niets. Het antwoord staat in het
# logboek en in de samenvatting van de run.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adressen, gescheiden door een spatie of een nieuwe regel"
        required: true
        type: string
      naam:
        description: "Productnaam om op te mikken (bijvoorbeeld: Marstek Venus E 4.0)"
        required: false
        type: string
      zoek:
        description: "Woorden om naast de bedragen op te zoeken, met komma's (bijvoorbeeld: scop,dB(A),aanvoertemperatuur)"
        required: false
        type: string
      links:
        description: "Toon de links op de pagina waar dit stuk tekst in staat (bijvoorbeeld: acs-classic)"
        required: false
        type: string
      bron:
        description: "Toon de ruwe HTML rond deze termen, met | ertussen (bijvoorbeeld: product_variations|variation_id)"
        required: false
        type: string
      kort:
        description: "Alleen titel, treffers en links tonen, zonder de prijsdiagnose per route"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  kijken:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Dezelfde terugval als de prijsupdate, en om dezelfde reden: winkels die
      # een kaal verzoek weigeren of het bedrag pas in de browser invullen.
      # Zonder deze stap draait het script gewoon door en zegt het erbij dat de
      # browser er niet was - dat is iets anders dan "de winkel weigert".
      - name: Browser klaarzetten
        timeout-minutes: 10
        continue-on-error: true
        run: npm i --no-save playwright && npx playwright install chromium

      # Voor pdf's: garantievoorwaarden en datasheets staan vaak alleen als pdf
      # online, en die leest het script met pdftotext. Een pakket op de runner,
      # niet in package.json, net als cwebp in de fotowerkstroom.
      - name: pdftotext klaarzetten
        continue-on-error: true
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Pagina's uitlezen
        env:
          URLS: ${{ inputs.urls }}
          NAAM: ${{ inputs.naam }}
          ZOEK: ${{ inputs.zoek }}
          LINKS: ${{ inputs.links }}
          KORT: ${{ inputs.kort }}
          BRON: ${{ inputs.bron }}
        run: npm run winkelpagina
